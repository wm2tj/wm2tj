# Build the Debian packages on every push to main and on demand, and attach
# them to a GitHub release when a v* tag is pushed (v0.1.0-beta.1 for the
# debian/changelog version 0.1.0~beta1).
name: deb

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper pkgconf libx11-dev libxext-dev libxft-dev libxi-dev gettext lintian

      - name: Build
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../*.deb ../*.changes ../*.buildinfo dist/
          # Ubuntu also emits -dbgsym .ddeb files, and lintian refuses a .changes
          # whose listed files are missing; Debian builders produce none
          mv ../*.ddeb dist/ 2>/dev/null || true
          ls -l dist

      - name: lintian
        run: lintian --info --fail-on error --profile debian dist/*.changes

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ github.sha }}
          path: dist/*.deb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --title "wm2tj $GITHUB_REF_NAME" --prerelease --generate-notes
